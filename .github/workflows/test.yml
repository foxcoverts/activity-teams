name: Test

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:
    secrets:
      RALPHJSMIT_COMPOSER_USERNAME:
        required: true
      RALPHJSMIT_COMPOSER_PASSWORD:
        required: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Artisan Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: testing
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, dom, fileinfo, pdo_mysql, intl, gd
          coverage: none
          tools: composer:v2

      - name: Authenticate private Composer packages
        env:
          RALPHJSMIT_COMPOSER_USERNAME: ${{ secrets.RALPHJSMIT_COMPOSER_USERNAME }}
          RALPHJSMIT_COMPOSER_PASSWORD: ${{ secrets.RALPHJSMIT_COMPOSER_PASSWORD }}
        run: |
          if [ -z "${RALPHJSMIT_COMPOSER_USERNAME}" ] || [ -z "${RALPHJSMIT_COMPOSER_PASSWORD}" ]; then
            echo "::error::RALPHJSMIT_COMPOSER_USERNAME and RALPHJSMIT_COMPOSER_PASSWORD secrets are required (Satis login for ralphjsmit packages)."
            exit 1
          fi
          composer config http-basic.satis.ralphjsmit.com \
            "${RALPHJSMIT_COMPOSER_USERNAME}" \
            "${RALPHJSMIT_COMPOSER_PASSWORD}"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: composer test
