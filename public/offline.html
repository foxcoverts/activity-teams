<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Offline — Activity Teams</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 1.5rem;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #0f172a;
                color: #f8fafc;
            }

            .card {
                background: #1e293b;
                box-shadow: none;
            }
        }

        .card {
            max-width: 28rem;
            width: 100%;
            background: #ffffff;
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 1px 3px rgb(15 23 42 / 0.12);
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: 1.25rem;
            font-weight: 600;
        }

        p {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        button {
            margin-top: 1.25rem;
            appearance: none;
            border: 0;
            border-radius: 0.5rem;
            background: #0ea5e9;
            color: #ffffff;
            font: inherit;
            font-weight: 600;
            padding: 0.6rem 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>You are offline</h1>
        <p>
            Activity Teams needs a network connection for this page.
            Bookings and session details are not available offline yet.
        </p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
