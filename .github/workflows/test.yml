name: Test

on:
  pull_request:
  workflow_call:
    secrets:
      RALPHJSMIT_COMPOSER_USERNAME:
        required: true
      RALPHJSMIT_COMPOSER_PASSWORD:
        required: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Artisan Test
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    env:
      APP_ENV: testing
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - "3306:3306"
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, dom, fileinfo, pdo_mysql, intl, gd
          coverage: none
          tools: composer:v2

      - name: Authenticate private Composer packages
        env:
          RALPHJSMIT_COMPOSER_USERNAME: ${{ secrets.RALPHJSMIT_COMPOSER_USERNAME }}
          RALPHJSMIT_COMPOSER_PASSWORD: ${{ secrets.RALPHJSMIT_COMPOSER_PASSWORD }}
        run: |
          if [ -z "${RALPHJSMIT_COMPOSER_USERNAME}" ] || [ -z "${RALPHJSMIT_COMPOSER_PASSWORD}" ]; then
            echo "::error::RALPHJSMIT_COMPOSER_USERNAME and RALPHJSMIT_COMPOSER_PASSWORD secrets are required (Satis login for ralphjsmit packages)."
            exit 1
          fi
          composer config http-basic.satis.ralphjsmit.com \
            "${RALPHJSMIT_COMPOSER_USERNAME}" \
            "${RALPHJSMIT_COMPOSER_PASSWORD}"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        # No --optimize-autoloader: tests do not need a classmap dump, and post-autoload-dump scripts still run.
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      # Frontend assets are not built here: Tests\TestCase uses withoutVite(). Deploy still runs npm.

      - name: Run tests
        run: composer test
